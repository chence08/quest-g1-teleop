name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch and verify pinned upstream sources
        run: python scripts/fetch_upstream.py
      - name: Install lightweight test dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.15.2
          sudo apt-get update -qq
          sudo apt-get install -y libeigen3-dev
      - name: Compile Python and check shell syntax
        run: |
          python -m compileall -q scripts tests
          for script in ./*.sh scripts/*.sh; do [ ! -f "$script" ] || bash -n "$script"; done
      - name: Run transport, lifecycle, configuration and bootstrap tests
        run: |
          python - <<'PYTEST'
          from pathlib import Path
          import unittest
          suite = unittest.TestSuite()
          for path in sorted(Path('tests').glob('test_*.py')):
              if path.name in {'test_tracked_quest.py', 'test_camera_protocol.py'}:
                  continue  # Full-environment integration tests run with ./run_python.sh.
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=path.name))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PYTEST
      - name: Test patched serial code with PTYs only
        run: |
          mkdir -p .cache/serial-test reports
          g++ -std=c++17 -O2 -Wall -Wextra -pthread -Irepos/DFX_inspire_service/include \
            tests/serial/serial_pty_client.cpp -o .cache/serial-test/client
          python tests/serial/test_serial_pty.py --binary .cache/serial-test/client --report reports/serial-test.json
